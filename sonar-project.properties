# SonarCloud settings (SA-22). Keys are identifiers, not secrets.
sonar.organization=sayf-01
sonar.projectKey=Sayf-01_CareerNet-SOEN341-2026

# Whole repo is analyzed (SonarCloud ignores sonar.sources / sonar.tests in its current mode),
# so skip generated and dependency folders.
sonar.exclusions=**/node_modules/**,dist/**,coverage/**,htmlcov/**,**/__pycache__/**

# Coverage reports produced by CI (SA-21)
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Only product code is measured for coverage: not tests, DB migrations, scripts, entry point
sonar.coverage.exclusions=tests/**,alembic/**,scripts/**,src/test/**,src/**/*.test.ts,src/**/*.test.tsx,src/main.tsx,*.config.ts,*.config.js
